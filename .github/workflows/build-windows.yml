name: Build Windows

# Triggers:
#   - push a version tag from Mac:  git tag v1.0.0 && git push origin v1.0.0
#   - manual run from GitHub UI (Actions tab → Run workflow) for testing

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. v1.0.0). Defaults to "dev".'
        required: false
        default: 'dev'

permissions:
  contents: write   # needed to upload to GitHub Releases

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python ───────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Determine version label ───────────────────────────────
      # On tag push  → use the tag (e.g. v1.0.0)
      # On manual run → use the workflow_dispatch input
      - name: Set version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      # ── 4. Install dependencies ──────────────────────────────────
      # pip on a fresh GitHub Actions Windows runner:
      # - Python DLLs are in the standard PATH, so PyInstaller finds
      #   sqlite3/ssl/lzma automatically (no conda Library/bin needed)
      # Installing the local package (editable) registers accurate
      # metadata so importlib.metadata.version() returns the version
      # from pyproject.toml (used for the window title).
      # Pinned to the stack that produced the last verified build —
      # an unpinned resolve here would silently ship library versions
      # the app was never tested against.  Bump deliberately.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install snappy==3.3.2 numpy==2.4.4 scipy==1.17.1 PySide6==6.11.0 pyinstaller==6.20.0 Pillow
          pip install -e . --no-deps
          python -c "from importlib.metadata import version; print('refined-index-calculator metadata:', version('refined-index-calculator'))"

      # ── 5. Generate .ico ─────────────────────────────────────────
      # macOS uses .icns — Windows needs .ico. Generate from the PNG.
      - name: Generate icon and splash image
        run: |
          python -c "
          from PIL import Image
          img = Image.open('assets/ManifoldIndex_1024.png')
          img.save('assets/ManifoldIndex.ico', format='ICO',
                   sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          print('ManifoldIndex.ico generated')
          img.resize((360, 360)).save('assets/ManifoldIndex_splash.png')
          print('ManifoldIndex_splash.png generated')
          "

      # ── 6. Preflight checks ──────────────────────────────────────
      # compileall FIRST: a module that fails to compile under the CI
      # Python is silently dropped by PyInstaller ("invalid module" in
      # the warn file) and the frozen app then dies at startup with
      # ModuleNotFoundError.  This exact failure shipped once — a
      # backslash inside an f-string expression is legal from 3.12 but
      # a SyntaxError on the 3.11 used here, so the developer's newer
      # local Python never saw it.
      - name: Verify all sources compile on this Python
        run: |
          python -VV
          python -m compileall -q src launcher.py rthook_snappy.py
          echo "all sources compile — OK"

      # Import the real GUI module graph, not just the lazy entry
      # point (launch_gui defers every Qt/window import into its body,
      # so importing it alone proves almost nothing).
      - name: Verify GUI import graph
        env:
          QT_QPA_PLATFORM: minimal
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          import manifold_index.app.window
          import manifold_index.app.pipeline.pipeline_view
          import manifold_index.app.datahub.datahub_view
          print('GUI import graph OK')
          "

      # ── 7. PyInstaller build ─────────────────────────────────────
      - name: Build with PyInstaller
        run: |
          pyinstaller ManifoldIndex_win.spec --noconfirm --clean

      # ── 8. Verify output ─────────────────────────────────────────
      - name: Verify build output
        shell: bash
        run: |
          if [ ! -f "dist/ManifoldIndex.exe" ]; then
            echo "ERROR: dist/ManifoldIndex.exe not found"
            exit 1
          fi
          echo "ManifoldIndex.exe found — OK"

      # ── 8b. Smoke test the frozen exe ───────────────────────────
      # Runs the actual bundled app headless on the Windows runner:
      # constructs the full MainWindow, loads a census manifold
      # (exercises the SnapPy SQLite databases), does a process-pool
      # spawn roundtrip (the parallel-kernel path), and exits 0/1
      # with a JSON report. Catches "builds fine, dies at runtime".
      - name: Smoke test exe
        shell: bash
        run: |
          # Native windows QPA (runner has a desktop session) —
          # QT_QPA_PLATFORM=offscreen is unsupported with QtWebEngine
          # on Windows and hangs the compositor.
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-gpu"
          export MANIFOLDINDEX_SMOKE=1
          export MANIFOLDINDEX_SMOKE_OUT="$PWD/smoke.json"
          status=0
          # In-app watchdog dumps all thread stacks + exits at 240 s;
          # this outer timeout is the backstop only.
          timeout 360 ./dist/ManifoldIndex.exe || status=$?
          echo "exe exit code: $status"
          echo "--- smoke.json ---"
          cat smoke.json 2>/dev/null || echo "(no smoke.json produced)"
          echo "--- crash.log ---"
          cat "$LOCALAPPDATA/manifold-index/logs/crash.log" 2>/dev/null || echo "(none)"
          echo "--- faulthandler.log ---"
          cat "$LOCALAPPDATA/manifold-index/logs/faulthandler.log" 2>/dev/null || echo "(none)"
          cp "$LOCALAPPDATA/manifold-index/logs/"*.log . 2>/dev/null || true
          exit $status

      # ── 9. Upload artifact (always) ─────────────────────────────
      # Available in Actions tab even on manual/non-tag runs.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManifoldIndex-${{ steps.ver.outputs.version }}-windows
          path: dist/ManifoldIndex.exe
          retention-days: 7

      # PyInstaller's warn file lists every module it could not bundle —
      # the first thing to read when a runtime import fails.
      - name: Upload build warnings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-warnings-${{ steps.ver.outputs.version }}
          path: |
            build/ManifoldIndex_win/warn-*.txt
            smoke.json
            crash.log
            faulthandler.log
          retention-days: 30
          if-no-files-found: ignore

      # ── 10. Upload to GitHub Release (tag pushes only) ──────────
      # No `body:` here — release.sh creates the release with combined
      # macOS + Windows notes; setting a body would overwrite them.
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          files: dist/ManifoldIndex.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
